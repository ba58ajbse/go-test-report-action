name: Go Test with Flags

on:
  pull_request:

permissions:
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run tests with race detector
        uses: ./
        with:
          working-directory: example
          test-flags: "-race -count=1"
