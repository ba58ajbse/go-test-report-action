name: Go Test Results Demo

on:
  pull_request:

permissions:
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        run: go test -json ./example/... > test-results.json 2>&1 || true

      - name: Post test results
        uses: ./
        with:
          test-results-file: test-results.json
